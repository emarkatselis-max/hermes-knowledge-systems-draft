# Static build of the HERMES draft site, deployed to GitHub Pages.
# NOTE: the first run requires the user to enable Pages once in the repo:
# Settings → Pages → Build and deployment → Source: GitHub Actions (enabled 2026-10-02).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one Pages deployment at a time; do not cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site for GitHub Pages
        # The Lovable build preset only runs TanStack prerendering (and writes
        # dist/client) in its build-environment mode; outside it, nitro's own
        # crawler 404s on the repo subpath and the SSR build fails.
        env:
          LOVABLE_SANDBOX: "1"
        run: bun run build:pages

      - name: Verify build output uses the repository subpath
        shell: bash
        run: |
          set -euo pipefail
          base="/hermes-knowledge-systems-draft/"
          for p in index.html etaireia/index.html ypiresies/index.html erga-ekdoseis/index.html \
                   etairika-stoixeia/index.html epikoinonia/index.html aporrito/index.html; do
            test -s "dist/client/$p" || { echo "::error::missing dist/client/$p"; exit 1; }
            grep -aq "${base}assets/" "dist/client/$p" || { echo "::error::$p lacks ${base} asset paths"; exit 1; }
          done
          if [ -e dist/client/ergaleia ]; then echo "::error::maintainer tool must not be published"; exit 1; fi

      # Fails (and blocks upload/deploy) while Pages is not enabled with
      # Source: GitHub Actions — enablement is intentionally left off.
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: false

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
